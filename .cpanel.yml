---
deployment:
  tasks:
    - export DEPLOYPATH=/home4/usittel/public_html/
    - /bin/cp .htaccess .user.ini php.ini index.html home.php "$DEPLOYPATH"
    - /bin/cp -R assets atencion datos-personales includes internet-fibra-optica-tandil js pages "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/autogestion/assets" "$DEPLOYPATH/autogestion/js" "$DEPLOYPATH/autogestion/vendor/librespeed" "$DEPLOYPATH/autogestion/server"
    - /bin/cp autogestion/.htaccess autogestion/index.html autogestion/api.php "$DEPLOYPATH/autogestion/"
    - /bin/cp autogestion/assets/* "$DEPLOYPATH/autogestion/assets/"
    - /bin/cp autogestion/js/* "$DEPLOYPATH/autogestion/js/"
    - /bin/cp autogestion/vendor/librespeed/speedtest_worker.js "$DEPLOYPATH/autogestion/vendor/librespeed/"
    - /bin/cp autogestion/server/Api.php autogestion/server/Core.php autogestion/server/CustomerContract.php autogestion/server/DocumentTransport.php autogestion/server/InvoiceDocuments.php autogestion/server/Invoices.php autogestion/server/PaymentHistory.php autogestion/server/Payments.php autogestion/server/Phantom.php autogestion/server/PhantomPayments.php autogestion/server/PhantomSoap.php autogestion/server/Schema.php autogestion/server/ServiceDiagnostics.php autogestion/server/ServiceFeatures.php autogestion/server/ServiceRequests.php autogestion/server/Services.php autogestion/server/Siro.php autogestion/server/Wifi.php autogestion/server/router.php "$DEPLOYPATH/autogestion/server/"
