<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f7f8f7">
    <title>Mi USITTEL · Ingresar</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="assets/app.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div class="demo-strip" hidden></div>
    <div id="app"></div>
    <div id="central-chat-mount" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <button type="button" data-action="chat-launcher" class="portal-chat-toggle" aria-label="Abrir chat de soporte" aria-expanded="false" aria-controls="central-chat-mount" title="Abrir chat de soporte">
      <svg class="icon chat-open-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#message-circle"></use></svg>
      <svg class="icon chat-close-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#x"></use></svg>
    </button>
    <noscript>Activá JavaScript para recorrer el prototipo de Mi USITTEL. No se realizan operaciones reales.</noscript>
  </body>
</html>
