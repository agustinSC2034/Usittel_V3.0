<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243a">
  <meta name="description" content="Participá del sorteo USITTEL en ExpoTan 2026.">
  <title>ExpoTan · USITTEL</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../assets/icons/usittel-logo.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./settings.js"></script>
  <script defer src="./core.js"></script>
  <script defer src="./store.js"></script>
  <script defer src="./sync.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" id="admin-trigger" role="button" tabindex="0" aria-label="USITTEL; mantener presionado para administración">
        <img src="../assets/img/logos/usittel_logo_and_name_blanco.webp" alt="USITTEL" draggable="false">
      </div>
      <div class="topbar-right"><span id="event-label">ExpoTan 2026</span><span class="status-dot" id="connection-dot" aria-hidden="true"></span><span id="connection-label" class="sr-only">Estado de conexión</span><button type="button" class="admin-shortcut" id="admin-shortcut" aria-label="Abrir administración" title="Administración"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.88 1.88-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1.2 1.56V20h-2.65v-.04A1.7 1.7 0 0 0 10.9 18.4a1.7 1.7 0 0 0-1.88.34l-.06.06-1.88-1.88.06-.06A1.7 1.7 0 0 0 7.5 15a1.7 1.7 0 0 0-1.56-1.2H5.9v-2.65h.04A1.7 1.7 0 0 0 7.5 9.9a1.7 1.7 0 0 0-.34-1.88L7.1 7.96l1.88-1.88.06.06A1.7 1.7 0 0 0 10.9 6.5a1.7 1.7 0 0 0 1.2-1.56V4.9h2.65v.04A1.7 1.7 0 0 0 16 6.5a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.88 1.88-.06.06A1.7 1.7 0 0 0 19.4 9.9a1.7 1.7 0 0 0 1.56 1.2H21v2.65h-.04A1.7 1.7 0 0 0 19.4 15Z"/></svg></button></div>
    </header>
    <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <dialog id="pin-dialog" class="pin-dialog" aria-labelledby="pin-title">
    <form method="dialog" id="pin-form">
      <h2 id="pin-title">Panel del stand</h2>
      <p>Ingresá el PIN para abrir administración.</p>
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" required>
      <p id="pin-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="pin-cancel" class="button secondary">Cancelar</button><button type="submit" class="button primary">Ingresar</button></div>
    </form>
  </dialog>
</body>
</html>
